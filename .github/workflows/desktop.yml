name: Build desktop apps
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libx11-xcb1 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 xvfb xauth libreoffice-writer
      - run: python -m pip install -r desktop/requirements.txt
      - run: python -m unittest discover -s desktop/tests -v
      - name: Check Qt rendering and resources
        run: python desktop/check_ui.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python desktop/build.py
      - name: Check packaged executable
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            dist/portable/OpenLorikeet/OpenLorikeet.exe --self-test
          else
            timeout 60 dist/portable/OpenLorikeet/OpenLorikeet --self-test
          fi
      - name: Build Windows setup executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler desktop/windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = (Resolve-Path dist/OpenLorikeet-Windows-x64-Setup.exe).Path
          $target = Join-Path $env:RUNNER_TEMP 'OpenLorikeet-installed'
          $result = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Setup failed' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $test = Start-Process (Join-Path $target 'OpenLorikeet.exe') -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Installed app self-test failed' }
          $uninstall = Start-Process (Join-Path $target 'unins000.exe') -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
      - name: Build Linux installable package
        if: runner.os == 'Linux'
        run: |
          python desktop/linux-package.py
          sudo dpkg -i dist/OpenLorikeet-Linux-x64.deb
          QT_QPA_PLATFORM=offscreen timeout 60 /opt/openlorikeet/OpenLorikeet --self-test
          xvfb-run -a env QT_QPA_PLATFORM=xcb timeout 60 /opt/openlorikeet/OpenLorikeet --self-test
          sudo dpkg -r openlorikeet
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLorikeet-${{ runner.os }}
          path: |
            dist/OpenLorikeet-*.zip
            dist/OpenLorikeet-*.tar.gz
            dist/OpenLorikeet-*.exe
            dist/OpenLorikeet-*.deb
          if-no-files-found: error
  macOS:
    timeout-minutes: 25
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test.sh
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLorikeet-macOS
          path: dist/OpenLorikeet-macOS-*.zip
  website:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-site.mjs

  release:
    timeout-minutes: 10
    needs: [portable, macOS, website]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OpenLorikeet-*
          merge-multiple: true
          path: packages
      - name: Publish complete desktop download set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: desktop-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          cd packages
          test -s OpenLorikeet-Windows-x64-Setup.exe
          test -s OpenLorikeet-Linux-x64.deb
          test -s OpenLorikeet-Windows-x64.zip
          test -s OpenLorikeet-Linux-x64.tar.gz
          test -s OpenLorikeet-macOS-arm64.zip
          sha256sum OpenLorikeet-* > SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          OpenLorikeet desktop development builds for macOS, Windows, and Linux.

          Windows: download and run OpenLorikeet-Windows-x64-Setup.exe. It installs the app and creates a Start menu shortcut. The ZIP is an optional portable edition.
          Linux (Debian/Ubuntu): install OpenLorikeet-Linux-x64.deb and launch from your app menu. The tar.gz is an optional portable edition.
          macOS: extract the ZIP and move OpenLorikeet.app to Applications.

          Windows/Linux Word-to-PDF requires a separate LibreOffice installation.
          Automated build and rendering checks passed. Real desktop acceptance remains pending.
          These builds are not notarized or signed with a public distribution certificate.
          NOTES
          gh release create "$RELEASE_TAG" OpenLorikeet-* SHA256SUMS.txt --repo "$GH_REPO" --target "$GITHUB_SHA" --title OpenLorikeet --prerelease --notes-file notes.md
