name: Build desktop apps
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libreoffice-writer
      - run: python -m pip install -r desktop/requirements.txt
      - run: python -m unittest discover -s desktop/tests -v
      - name: Check Qt rendering and resources
        run: python desktop/check_ui.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python desktop/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLorikeet-${{ runner.os }}
          path: dist/OpenLorikeet-*.zip
          if-no-files-found: error
  macOS:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test.sh
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLorikeet-macOS
          path: dist/OpenLorikeet-macOS-*.zip
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-site.mjs
